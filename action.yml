name: "AssertState"
description: >-
  Run an AssertState acceptance contract and gate the PR on the oracle-derived verdict
  (exit 0 PASS · 1 FAIL · 2 usage · 3 INCONCLUSIVE · 4 ERROR-dominated). Posts a redacted PR
  summary, uploads the evidence bundle as an artifact, and optionally regression-gates against a
  stored baseline. The Action is only an integration layer around the trusted AssertState CLI —
  it never executes the agent itself, never reinterprets the verdict, and never relaxes redaction
  or the sandbox. Requires AssertState to be installed in the runner (this repo, or a vendored /
  source install) — AssertState is not yet published to a registry.
branding:
  icon: check-circle
  color: green
inputs:
  contract:
    description: "Path to the contract YAML to run (relative to the checked-out repo)."
    required: true
  app:
    description: "Built-in app target (e.g. demo). Omit when using config."
    required: false
    default: ""
  config:
    description: "assertstate.yaml describing a real app target (implies oracle secrets)."
    required: false
    default: ""
  adapter:
    description: "Execution adapter: browser-use | http | noop | demo."
    required: false
    default: "browser-use"
  scenario:
    description: "Demo app behavior (correct | slow_retry), demo path only."
    required: false
    default: "correct"
  trials:
    description: "Override the contract's trial count."
    required: false
    default: ""
  sandbox:
    description: "Adapter-execution sandbox: auto | container | off."
    required: false
    default: "auto"
  run-id:
    description: "Run id for the stored evidence bundle."
    required: false
    default: "pr-run"
  baseline:
    description: "Optional baseline run (id/dir/run.json) to regression-gate against."
    required: false
    default: ""
  confidence:
    description: "Confidence for the regression comparison."
    required: false
    default: "0.95"
  allow-fork:
    description: "Explicitly allow a fork PR to run with a config (secrets). Default false = fail closed."
    required: false
    default: "false"
  install:
    description: "auto = pip-install AssertState from the action's own source if not already importable; skip = assume it is already installed."
    required: false
    default: "auto"
runs:
  using: "composite"
  steps:
    # Make the Action usable cross-repo WITHOUT a published package: if AssertState is not already
    # importable (e.g. an in-repo `uses: ./` that ran `uv sync`), install it from the action's own
    # checked-out source ($GITHUB_ACTION_PATH). No registry/credential required.
    - name: Ensure AssertState is installed
      if: ${{ inputs.install == 'auto' }}
      shell: bash
      run: |
        set -uo pipefail
        if ! python -c "import assertstate" 2>/dev/null; then
          python -m pip install "${GITHUB_ACTION_PATH:-.}"
        fi
    # Fork fail-closed: a fork PR must never run against a real app's oracle secrets unless the
    # maintainer explicitly opts in. The secret-free built-in demo (no config) is allowed.
    - name: Fork safety gate
      shell: bash
      run: |
        set -euo pipefail
        is_fork='${{ github.event.pull_request.head.repo.fork }}'
        if [ "$is_fork" = "true" ] && [ -n "${{ inputs.config }}" ] && [ "${{ inputs.allow-fork }}" != "true" ]; then
          echo "::error::AssertState refuses to run a --config (oracle-secret) contract from a fork PR. Use the built-in demo, run on a trusted branch, or set allow-fork: true deliberately."
          exit 4   # ERROR semantics — fail closed, never run privileged on untrusted code
        fi

    # Run the contract through the trusted CLI. Capture the exit code WITHOUT failing the step, so
    # the summary + evidence still publish on FAIL/ERROR; the final gate re-exits the real code.
    - name: Run AssertState contract
      shell: bash
      run: |
        set -uo pipefail
        args=(run "${{ inputs.contract }}" --run-id "${{ inputs.run-id }}" --sandbox "${{ inputs.sandbox }}" --scenario "${{ inputs.scenario }}")
        [ -n "${{ inputs.app }}" ]     && args+=(--app "${{ inputs.app }}")
        [ -n "${{ inputs.config }}" ]  && args+=(--config "${{ inputs.config }}")
        [ -n "${{ inputs.adapter }}" ] && args+=(--adapter "${{ inputs.adapter }}")
        [ -n "${{ inputs.trials }}" ]  && args+=(--trials "${{ inputs.trials }}")
        python -m assertstate.cli "${args[@]}"
        echo "ASSERTSTATE_EXIT=$?" >> "$GITHUB_ENV"

    # Redacted PR/job summary, generated by the tested Python reporter over the redacted run.json.
    - name: PR summary
      if: ${{ always() }}
      shell: bash
      run: |
        set -uo pipefail
        python -m assertstate.cli report "${{ inputs.run-id }}" --format summary \
          >> "${GITHUB_STEP_SUMMARY:-/dev/stderr}" || echo "::warning::no evidence to summarize"

    # Optional regression gate vs a baseline (FEATURE-SPEC §8.5/§10).
    - name: Regression gate
      if: ${{ always() && inputs.baseline != '' }}
      shell: bash
      run: |
        set -uo pipefail
        python -m assertstate.cli compare "${{ inputs.baseline }}" "${{ inputs.run-id }}" \
          --confidence "${{ inputs.confidence }}"
        echo "ASSERTSTATE_REGRESSION_EXIT=$?" >> "$GITHUB_ENV"

    # Upload the existing evidence bundle verbatim (run.json, trials/, manifest.json, evidence.zip,
    # contract.yaml, junit.xml, report.html). No second evidence format is invented.
    - name: Upload evidence bundle
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: assertstate-evidence-${{ inputs.run-id }}
        path: .assertstate/runs/${{ inputs.run-id }}/
        if-no-files-found: warn

    # Gate: re-exit the exact CLI verdict code (and the regression code if it gated). Never
    # collapse FAIL/INCONCLUSIVE/ERROR into success.
    - name: Gate on verdict
      if: ${{ always() }}
      shell: bash
      run: |
        set -uo pipefail
        verdict_code="${ASSERTSTATE_EXIT:-4}"
        regression_code="${ASSERTSTATE_REGRESSION_EXIT:-0}"
        if [ "$verdict_code" != "0" ]; then exit "$verdict_code"; fi
        exit "$regression_code"
