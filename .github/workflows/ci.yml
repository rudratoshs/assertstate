name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ASSERTSTATE_PG_HOST: 127.0.0.1
      ASSERTSTATE_PG_ADMIN_USER: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install PostgreSQL client (psql / pg_isready)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create venv + install
        run: |
          uv venv --python 3.11
          uv pip install -e '.[dev]'
      - name: Lint (ruff)
        run: |
          uv run ruff check assertstate tests demo-app scripts
          uv run ruff format --check assertstate tests demo-app scripts
      - name: Type-check (mypy --strict)
        run: uv run mypy
      - name: Tests (unit + integration against the postgres service)
        run: uv run pytest -q
      # Re-run the negative control after the suite because its test fixture cleans up
      # fixed run IDs between tests. Exit 1 is the expected contract failure.
      - name: Run slow-retry counterfactual
        if: success()
        shell: bash
        run: |
          set +e
          uv run python -m assertstate.cli run contracts/pay-invoice.e2e.yaml --app demo --scenario slow_retry --run-id ci-slow-retry
          verdict=$?
          set -e
          if [ "$verdict" -ne 1 ]; then
            echo "::error::Expected the slow-retry counterfactual to fail with exit 1; got $verdict"
            exit 1
          fi
      - name: Upload slow-retry counterfactual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assertstate-slow-retry-counterfactual
          path: .assertstate/runs/ci-slow-retry/
          if-no-files-found: error
          include-hidden-files: true
