name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ASSERTSTATE_PG_HOST: 127.0.0.1
      ASSERTSTATE_PG_ADMIN_USER: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install PostgreSQL client (psql / pg_isready)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create venv + install
        run: |
          uv venv --python 3.11
          uv pip install -e '.[dev]'
      - name: Lint (ruff)
        run: |
          uv run ruff check assertstate tests demo-app scripts
          uv run ruff format --check assertstate tests demo-app scripts
      - name: Type-check (mypy --strict)
        run: uv run mypy
      - name: Tests (unit + integration against the postgres service)
        run: uv run pytest -q
